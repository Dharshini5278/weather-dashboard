<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤 Weather Dashboard</h1>
        <p class="subtitle">Search for the current weather of any city</p>

        <!-- Search Section -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                autocomplete="off"
            >

            <button id="searchBtn">Search</button>

        </div>

        <!-- Error Message -->
        <p id="errorMessage" class="error"></p>

        <!-- Loading -->
        <p id="loading" class="loading">Loading...</p>

        <!-- Weather Card -->
        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">City</h2>
            <p id="countryName">Country</p>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">-- %</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">-- °C</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
